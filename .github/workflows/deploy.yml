name: Build Web App (Self-Hosted)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd
        working-directory: ./web # Chạy các lệnh NPM bên trong thư mục web
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone React App
        working-directory: .
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if exist web rmdir /s /q web
          git clone --depth 1 https://%GH_PAT%@github.com/uitbestteam/checkpoint-app-reactjs.git web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Sử dụng bản LTS ổn định

      - name: Install dependencies
        run: npm.cmd install

      - name: Build project
        run: npm.cmd run build
