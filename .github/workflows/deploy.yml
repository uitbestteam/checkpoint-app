name: Build Web App (Self-Hosted)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd
        working-directory: ./web # Chạy các lệnh NPM bên trong thư mục web

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      # NẾU 'web' là repo riêng, bạn cần pull nó về thư mục 'web' như sau:
      - name: Checkout frontend code
        uses: actions/checkout@v4
        with:
          repository: uitbestteam/checkpoint-web # Thay bằng repo chứa code frontend thật
          path: web
          # token: ${{ secrets.YOUR_GITHUB_TOKEN }} # Bật nếu repo frontend là private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Sử dụng bản LTS ổn định

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
