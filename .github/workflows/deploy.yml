name: Build Web App (Self-Hosted)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: self-hosted

    # Ép GitHub Actions dùng Command Prompt (cmd) của Windows để tránh lỗi bảo mật của PowerShell
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/actions-setup-node@v4
        with:
          node-version: '20' # Hạ xuống bản 20 (LTS) ổn định nhất, bản 24 dễ bị lỗi nếu máy bạn chưa cài sẵn
          cache: 'npm'

      - name: Install dependencies
        # Thay 'npm ci' bằng 'npm install' phòng trường hợp dự án của bạn thiếu file package-lock.json
        run: npm install

      - name: Build project
        run: npm run build

      # Tạm thời ẩn bước Test đi để ưu tiên cho việc Build thật chạy thành công trước đã
